server.port=8080

# ==== CONFIGURATION NON SECURISEE (GROUPE B — detectee) ====

# Secret en dur dans la config (BLOCKER Sonar)
spring.datasource.password=admin123
spring.datasource.username=root

# H2 console exposee (ZAP / Sonar : interface admin accessible)
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# Traces d'erreur completes exposees (divulgation d'info, ZAP)
